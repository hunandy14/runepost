# 結構性消滅「dist/ 與 src/ 不同步」：push／PR 一律跑 build.ps1 -Check。
# verify.ps1 的 P0 只在有人手動跑 verify 時擋得住，CI 才是不依賴人的防線。
name: build-check

on:
  push:
  pull_request:

jobs:
  build-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: build.ps1 -Check（dist/ 必須與 src/ 現況逐位元組一致）
        shell: pwsh
        run: ./build.ps1 -Check
